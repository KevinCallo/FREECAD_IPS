name: FreeCAD Core BIM DevOps CI/CD - UNSA

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-and-deployment:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno Nativo Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Framework Pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Ejecutar Pruebas de Calidad (BimHelp, BimWelcome, BimWPCommands)
      run: |
        pytest tests/ -v

    - name: Compilar Dashboard de Calidad Web (GitHub Pages)
      run: |
        mkdir -p docs
        echo "<html><body style='font-family: Arial, sans-serif; padding: 40px; background-color: #f7fafc; text-align: center;'>" > docs/index.html
        echo "<div style='background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; border-top: 5px solid #3182ce;'>" >> docs/index.html
        echo "<h1 style='color: #2b6cb0;'>FreeCAD OpenSource Core - UNSA</h1>" >> docs/index.html
        echo "<h2>Reporte de Integración Continua (Hito 2)</h2>" >> docs/index.html
        echo "<p style='background: #c6f6d5; color: #22543d; padding: 10px; border-radius: 4px; font-weight: bold;'>✅ PIPELINE COMPLETADO EXITOSAMENTE (TESTS PASSED)</p>" >> docs/index.html
        echo "<div style='text-align: left; background: #edf2f7; padding: 15px; border-radius: 4px; font-family: monospace; font-size: 0.9em; margin-top: 20px;'>" >> docs/index.html
        echo "• test_help_url_correcta -> PASSED (BimHelp.py)<br>" >> docs/index.html
        echo "• test_help_recursos_metadata -> PASSED (BimHelp.py)<br>" >> docs/index.html
        echo "• test_welcome_flujo_primera_vez -> PASSED (BimWelcome.py)<br>" >> docs/index.html
        echo "• test_welcome_enrutador_tutorial -> PASSED (BimWelcome.py)<br>" >> docs/index.html
        echo "• test_welcome_enrutador_externo -> PASSED (BimWelcome.py)<br>" >> docs/index.html
        echo "• test_wp_cambio_orientacion_exitoso -> PASSED (BimWPCommands.py)<br>" >> docs/index.html
        echo "• test_wp_cambio_orientacion_invalido -> PASSED (BimWPCommands.py)<br>" >> docs/index.html
        echo "• test_wp_auditoria_atajos_teclado -> PASSED (BimWPCommands.py)" >> docs/index.html
        echo "</div>" >> docs/index.html
        echo "<p style='color: #718096; font-size: 0.85em; margin-top: 25px;'>Evidencia DevOps compilada automáticamente por el servidor el: $(date)</p>" >> docs/index.html
        echo "</div></body></html>" >> docs/index.html

    - name: Publicar Dashboard en Servidor Abierto GitHub Pages
      run: |
        git config --global user.name "GitHub Actions DevOps Bot"
        git config --global user.email "actions@github.com"
        git add docs/index.html
        git diff-index --quiet HEAD || git commit -m "chore: autogenerate Hito 2 BIM QA report [skip ci]"
        git push