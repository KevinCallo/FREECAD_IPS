name: FreeCAD Core BIM DevOps CI/CD - UNSA

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  integration-and-deployment:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar Código del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno Nativo Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Framework Pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Ejecutar Pruebas de Calidad
      run: |
        pytest tests/ -v