<!-- Header con hero + nav contextual + filtro de documentación -->
<app-header
  page="docs"
  [docsFilter]="activeFilter()"
  (docsFilterChange)="onFilterChange($event)"
/>

<main class="docs-main">
  <div class="container">
    <div class="docs-grid">

      @switch (activeFilter()) {

        @case ('scrum-master') {
          <app-scrum-master-docs />
        }

        @case ('devops') {
          <app-devops-docs />
        }

        @case ('freecad') {
          <app-freecad-docs />
        }

        @case ('product-owner') {
          <app-product-owner-docs />
        }

      }

    </div>

    <!-- ══════════════════════════════════════════
         BACK TO HOME
         ══════════════════════════════════════════ -->
    <div class="back-home-bar">
      <a routerLink="/home" class="back-home-btn">
        <i class="fa-solid fa-arrow-left"></i>
        Volver al inicio
      </a>
    </div>

  </div>
</main>
